name: Build & Publish AppImage

on:
  schedule:
    # Run every hour at :37 (staggered – avoids the thundering herd at xx:00)
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # needed to create releases and upload assets

jobs:
  check-and-build:
    name: Check upstream and build AppImages
    runs-on: ubuntu-26.04

    steps:
      # ── 1. Checkout this repo ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ── 2. Fetch the latest upstream tag ─────────────────────────────────
      - name: Fetch latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_JSON=$(gh api repos/edde746/plezy/releases/latest)
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          BODY=$(echo "$RELEASE_JSON" | jq -r '.body // ""')

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Store the body as a multi-line output (delimiter trick avoids heredoc issues)
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "body<<${DELIM}"
            echo "$BODY"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::Upstream latest tag is ${TAG}"

      # ── 3. Check whether we already have a release for this tag ──────────
      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${TAG} already exists – nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${TAG} not found – will build AppImages."
          fi

      # ── 4. Install build-time tools ───────────────────────────────────────
      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget curl jq file \
            desktop-file-utils \
            libfuse2 \
            zsync
          echo "::notice::Build dependencies installed."

      # ── 5. Download appimagetool at runtime ───────────────────────────────
      - name: Download appimagetool
        if: steps.check.outputs.exists == 'false'
        id: appimagetool
        run: |
          set -euo pipefail

          TOOL_JSON=$(curl -fsSL https://api.github.com/repos/AppImage/appimagetool/releases/latest)
          TOOL_VERSION=$(echo "$TOOL_JSON" | jq -r '.tag_name')

          # Fetch the x86_64 binary (the runner is always x86_64; we'll set
          # ARCH env var when packaging arm64, which appimagetool supports for
          # cross-building the outer squashfs).
          TOOL_URL=$(echo "$TOOL_JSON" | jq -r \
            '.assets[] | select(.name == "appimagetool-x86_64.AppImage") | .browser_download_url')

          wget -q -O /usr/local/bin/appimagetool "$TOOL_URL"
          chmod +x /usr/local/bin/appimagetool

          echo "tool_version=$TOOL_VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::appimagetool ${TOOL_VERSION} installed."

      # ── 6. Download upstream Linux tarballs ───────────────────────────────
      - name: Download upstream Linux tarballs
        if: steps.check.outputs.exists == 'false'
        id: download
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p upstream

          BASE_URL="https://github.com/edde746/plezy/releases/download/${TAG}"

          # x64 (always expected)
          X64_URL="${BASE_URL}/plezy-linux-x64.tar.gz"
          echo "Downloading ${X64_URL} ..."
          if wget -q -O upstream/plezy-linux-x64.tar.gz "$X64_URL"; then
            echo "x64=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Downloaded plezy-linux-x64.tar.gz"
          else
            echo "x64=false" >> "$GITHUB_OUTPUT"
            echo "::warning::plezy-linux-x64.tar.gz not available for ${TAG}"
          fi

          # arm64 (may or may not be published each release)
          ARM64_URL="${BASE_URL}/plezy-linux-arm64.tar.gz"
          echo "Downloading ${ARM64_URL} ..."
          if wget -q -O upstream/plezy-linux-arm64.tar.gz "$ARM64_URL"; then
            echo "arm64=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Downloaded plezy-linux-arm64.tar.gz"
          else
            echo "arm64=false" >> "$GITHUB_OUTPUT"
            rm -f upstream/plezy-linux-arm64.tar.gz
            echo "::warning::plezy-linux-arm64.tar.gz not available for ${TAG}"
          fi

          # Icon from upstream source tree
          echo "Downloading Plezy icon ..."
          wget -q -O plezy.png \
            "https://raw.githubusercontent.com/edde746/plezy/main/assets/plezy.png"
          echo "::notice::Icon downloaded."

      # ── 7. Build x86_64 AppImage ──────────────────────────────────────────
      - name: Build x86_64 AppImage
        if: >-
          steps.check.outputs.exists == 'false' &&
          steps.download.outputs.x64 == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          APPDIR="$(pwd)/AppDir-x86_64"
          mkdir -p "$APPDIR"

          # ── Extract tarball ───────────────────────────────────────────────
          tar -xzf upstream/plezy-linux-x64.tar.gz -C "$APPDIR"

          # Flutter Linux tarballs may place files directly at root or inside
          # a single subdirectory. Detect and flatten.
          BINARY=$(find "$APPDIR" -maxdepth 1 -type f -executable ! -name '*.so' | sort | head -1)
          if [[ -z "$BINARY" ]]; then
            echo "::notice::No executable at root; checking one level deeper ..."
            BINARY=$(find "$APPDIR" -maxdepth 2 -type f -executable ! -name '*.so' | sort | head -1)
            if [[ -n "$BINARY" ]]; then
              SUBDIR=$(dirname "$BINARY")
              echo "Flattening from: $SUBDIR"
              shopt -s dotglob
              mv "$SUBDIR"/* "$APPDIR/"
              shopt -u dotglob
              rmdir "$SUBDIR" 2>/dev/null || true
            fi
          fi
          BINARY=$(find "$APPDIR" -maxdepth 1 -type f -executable ! -name '*.so' | sort | head -1)
          BINARY_NAME=$(basename "$BINARY")
          echo "::notice::Main binary: ${BINARY_NAME}"

          # ── Icon ──────────────────────────────────────────────────────────
          cp plezy.png "$APPDIR/plezy.png"

          # ── .desktop file ─────────────────────────────────────────────────
          # Write without leading indentation so desktop-file-validate passes.
          # Exec uses AppRun (not the raw binary) for AppImageLauncher compat.
          # $APPDIR in the Exec line is intentional – AppImage convention;
          # appimagetool patches it at mount time.
          cat > "$APPDIR/com.edde746.plezy.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Plezy
          Comment=Modern cross-platform Plex & Jellyfin client
          Exec=AppRun %U
          Icon=plezy
          Categories=AudioVideo;Video;
          Terminal=false
          StartupWMClass=com.edde746.plezy
          EOF
          # Remove leading whitespace (sed handles YAML-indented heredocs)
          sed -i 's/^[[:space:]]*//' "$APPDIR/com.edde746.plezy.desktop"

          desktop-file-validate "$APPDIR/com.edde746.plezy.desktop"
          echo "::notice::.desktop file validated OK."

          # ── AppRun launcher ───────────────────────────────────────────────
          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/bash
          # AppRun – Plezy AppImage launcher
          # Works from any working directory; APPDIR is always the mounted image.
          set -euo pipefail
          HERE="$(dirname "$(readlink -f "${0}")")"
          export APPDIR="${HERE}"

          # Prefer bundled libs over system libs
          export LD_LIBRARY_PATH="${APPDIR}/lib:${LD_LIBRARY_PATH:-}"

          exec "${APPDIR}/plezy" "$@"
          EOF
          sed -i 's/^[[:space:]]*//' "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # AppImage spec: icon symlink at AppDir root
          ln -sf plezy.png "$APPDIR/.DirIcon"

          # ── Assemble AppImage ─────────────────────────────────────────────
          UPDATE_INFO="gh-releases-zsync|bl4ckswordsman|plezy-appimage|latest|*x86_64.AppImage.zsync"
          ARCH=x86_64 appimagetool \
            -u "$UPDATE_INFO" \
            "$APPDIR" \
            "Plezy-${TAG}-x86_64.AppImage" \
            2>&1

          ls -lh "Plezy-${TAG}-x86_64.AppImage"
          echo "::notice::Plezy-${TAG}-x86_64.AppImage built."

          # ── zsync sidecar ─────────────────────────────────────────────────
          zsyncmake \
            -o "Plezy-${TAG}-x86_64.AppImage.zsync" \
            -u "Plezy-${TAG}-x86_64.AppImage" \
            "Plezy-${TAG}-x86_64.AppImage"
          echo "::notice::Plezy-${TAG}-x86_64.AppImage.zsync generated."

      # ── 8. Build aarch64 AppImage ─────────────────────────────────────────
      - name: Build aarch64 AppImage
        if: >-
          steps.check.outputs.exists == 'false' &&
          steps.download.outputs.arm64 == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          APPDIR="$(pwd)/AppDir-aarch64"
          mkdir -p "$APPDIR"

          tar -xzf upstream/plezy-linux-arm64.tar.gz -C "$APPDIR"

          BINARY=$(find "$APPDIR" -maxdepth 1 -type f -executable ! -name '*.so' | sort | head -1)
          if [[ -z "$BINARY" ]]; then
            BINARY=$(find "$APPDIR" -maxdepth 2 -type f -executable ! -name '*.so' | sort | head -1)
            if [[ -n "$BINARY" ]]; then
              SUBDIR=$(dirname "$BINARY")
              shopt -s dotglob
              mv "$SUBDIR"/* "$APPDIR/"
              shopt -u dotglob
              rmdir "$SUBDIR" 2>/dev/null || true
            fi
          fi
          BINARY=$(find "$APPDIR" -maxdepth 1 -type f -executable ! -name '*.so' | sort | head -1)
          BINARY_NAME=$(basename "$BINARY")
          echo "::notice::Main binary: ${BINARY_NAME}"

          cp plezy.png "$APPDIR/plezy.png"

          cat > "$APPDIR/com.edde746.plezy.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Plezy
          Comment=Modern cross-platform Plex & Jellyfin client
          Exec=AppRun %U
          Icon=plezy
          Categories=AudioVideo;Video;
          Terminal=false
          StartupWMClass=com.edde746.plezy
          EOF
          sed -i 's/^[[:space:]]*//' "$APPDIR/com.edde746.plezy.desktop"

          desktop-file-validate "$APPDIR/com.edde746.plezy.desktop"
          echo "::notice::.desktop file validated OK."

          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/bash
          # AppRun – Plezy AppImage launcher
          set -euo pipefail
          HERE="$(dirname "$(readlink -f "${0}")")"
          export APPDIR="${HERE}"

          export LD_LIBRARY_PATH="${APPDIR}/lib:${LD_LIBRARY_PATH:-}"

          exec "${APPDIR}/plezy" "$@"
          EOF
          sed -i 's/^[[:space:]]*//' "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          ln -sf plezy.png "$APPDIR/.DirIcon"

          UPDATE_INFO="gh-releases-zsync|bl4ckswordsman|plezy-appimage|latest|*aarch64.AppImage.zsync"
          ARCH=aarch64 appimagetool \
            -u "$UPDATE_INFO" \
            "$APPDIR" \
            "Plezy-${TAG}-aarch64.AppImage" \
            2>&1

          ls -lh "Plezy-${TAG}-aarch64.AppImage"
          echo "::notice::Plezy-${TAG}-aarch64.AppImage built."

          zsyncmake \
            -o "Plezy-${TAG}-aarch64.AppImage.zsync" \
            -u "Plezy-${TAG}-aarch64.AppImage" \
            "Plezy-${TAG}-aarch64.AppImage"
          echo "::notice::Plezy-${TAG}-aarch64.AppImage.zsync generated."

      # ── 9. Collect assets and write job summary ────────────────────────────
      - name: Collect release assets and write summary
        if: steps.check.outputs.exists == 'false'
        id: assets
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          X64_BUILT: ${{ steps.download.outputs.x64 }}
          ARM64_BUILT: ${{ steps.download.outputs.arm64 }}
          TOOL_VERSION: ${{ steps.appimagetool.outputs.tool_version }}
        run: |
          set -euo pipefail

          ASSETS=()
          SUMMARY_ROWS=""

          if [[ "$X64_BUILT" == "true" && -f "Plezy-${TAG}-x86_64.AppImage" ]]; then
            SIZE=$(du -sh "Plezy-${TAG}-x86_64.AppImage" | cut -f1)
            ASSETS+=("Plezy-${TAG}-x86_64.AppImage" "Plezy-${TAG}-x86_64.AppImage.zsync")
            SUMMARY_ROWS+="| Plezy-${TAG}-x86_64.AppImage | x86_64 | ${SIZE} |\n"
          fi

          if [[ "$ARM64_BUILT" == "true" && -f "Plezy-${TAG}-aarch64.AppImage" ]]; then
            SIZE=$(du -sh "Plezy-${TAG}-aarch64.AppImage" | cut -f1)
            ASSETS+=("Plezy-${TAG}-aarch64.AppImage" "Plezy-${TAG}-aarch64.AppImage.zsync")
            SUMMARY_ROWS+="| Plezy-${TAG}-aarch64.AppImage | aarch64 | ${SIZE} |\n"
          fi

          # Write asset list for the next step
          printf '%s\n' "${ASSETS[@]}" > release-assets.txt
          echo "asset_list=$(IFS=,; echo "${ASSETS[*]}")" >> "$GITHUB_OUTPUT"

          # Write job summary
          {
            echo "## Plezy ${TAG} AppImage Build"
            echo ""
            echo "| File | Architecture | Size |"
            echo "| --- | --- | --- |"
            printf "%b" "$SUMMARY_ROWS"
            echo ""
            echo "**appimagetool version:** ${TOOL_VERSION}"
            echo ""
            echo "Release will be created with tag \`${TAG}\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::Asset collection complete: ${ASSETS[*]}"

      # ── 10. Create GitHub Release with assets ──────────────────────────────
      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_BODY: ${{ steps.upstream.outputs.body }}
        run: |
          set -euo pipefail

          # Build file table rows for the release body
          FILE_ROWS=""
          if [[ -f "Plezy-${TAG}-x86_64.AppImage" ]]; then
            SIZE=$(du -sh "Plezy-${TAG}-x86_64.AppImage" | cut -f1)
            FILE_ROWS+="| \`Plezy-${TAG}-x86_64.AppImage\` | x86_64 (most desktops) | ${SIZE} |"$'\n'
          fi
          if [[ -f "Plezy-${TAG}-aarch64.AppImage" ]]; then
            SIZE=$(du -sh "Plezy-${TAG}-aarch64.AppImage" | cut -f1)
            FILE_ROWS+="| \`Plezy-${TAG}-aarch64.AppImage\` | aarch64 (ARM, Raspberry Pi) | ${SIZE} |"$'\n'
          fi
          FILE_ROWS+="| \`*.AppImage.zsync\` | (all) | — |"

          # Write release notes to a temp file to avoid shell-quoting/indentation issues
          {
            printf '## Plezy %s — AppImage\n\n' "$TAG"
            printf 'Automatically packaged from the upstream [edde746/plezy](https://github.com/edde746/plezy) tarball.\n\n'
            printf '### Included Files\n\n'
            printf '| File | Architecture | Size |\n'
            printf '| --- | --- | --- |\n'
            printf '%s\n' "$FILE_ROWS"
            printf '\n'
            printf '> **FUSE note** — On Ubuntu 22.04+ you may need `libfuse2`:\n'
            printf '> `sudo apt install libfuse2`\n'
            printf '> Alternatively: `./Plezy-*.AppImage --appimage-extract-and-run`\n'
            printf '\n---\n\n'
            printf '## Upstream changelog\n\n'
            printf '%s\n' "$UPSTREAM_BODY"
          } > /tmp/release-notes.md

          # Gather asset files
          mapfile -t ASSET_FILES < release-assets.txt

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Plezy ${TAG}" \
            --notes-file /tmp/release-notes.md \
            "${ASSET_FILES[@]}"

          echo "::notice::GitHub Release ${TAG} created with ${#ASSET_FILES[@]} assets."

          # Append release URL to job summary
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          {
            echo ""
            echo "### Release published"
            echo ""
            echo "[View Release on GitHub](${RELEASE_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
